<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מכפילי הבנקים בישראל | משקיענית</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc4 100%);
      padding: 20px;
      color: #3e2723;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #faf7f2;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(92, 64, 51, 0.15);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #8B7355 0%, #6F4E37 100%);
      color: #f5f1e8;
      padding: 40px 30px;
      text-align: center;
      border-bottom: 4px solid #5C4033;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .content {
      padding: 40px 30px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc4 100%);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      border-left: 4px solid #8B7355;
      box-shadow: 0 2px 8px rgba(92, 64, 51, 0.08);
    }

    .metric-label {
      font-size: 12px;
      color: #6F4E37;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: #8B7355;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table thead {
      background: #e8dcc4;
      border-bottom: 2px solid #8B7355;
    }

    table th {
      padding: 15px;
      text-align: right;
      font-weight: 600;
      color: #5C4033;
    }

    table td {
      padding: 15px;
      border-bottom: 1px solid #e8dcc4;
      color: #3e2723;
    }

    table tbody tr:hover {
      background: #faf7f2;
    }

    .bank-name {
      font-weight: 600;
      color: #8B7355;
    }

    .above-avg {
      color: #558B2F;
      font-weight: 600;
    }

    .below-avg {
      color: #C62828;
      font-weight: 600;
    }

    .disclaimer {
      background: #fff3cd;
      border-left: 4px solid #8B7355;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 30px;
      font-size: 12px;
      color: #5C4033;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6F4E37;
    }

    .spinner {
      border: 3px solid #f5f1e8;
      border-top: 3px solid #8B7355;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #3e2723;
    }

    .footer {
      background: #e8dcc4;
      padding: 20px 30px;
      text-align: center;
      border-top: 1px solid #A0826D;
      font-size: 12px;
      color: #5C4033;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="header">
      <h1>מכפילי הבנקים בישראל</h1>
      <p style="opacity: 0.9;">צפה בנתוני שווי הוני של הבנקים הגדולים | משקיענית</p>
    </div>

    <div class="content" id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>טוען נתונים...</p>
      </div>
    </div>

    <div class="footer">
      ⚠️ הערה חשובה: המידע בדאשבורד זה מיועד למטרות למידה בלבד ואינו מהווה שום המלצה להשקעה.
    </div>
  </div>

  <script>
    // Bank weights (TASE indices)
    const BANK_WEIGHTS = {
      'בנק פועלים': 0.3478,
      'בנק לאומי': 0.3330,
      'דיסקונט בנק': 0.1450,
      'בנק מזרחי טפחות': 0.1275,
      'בנק בינלאומי': 0.0467
    };

    // Bank colors
    const bankColors = {
      'בנק פועלים': '#FF6B6B',
      'בנק לאומי': '#4ECDC4',
      'דיסקונט בנק': '#45B7D1',
      'בנק מזרחי טפחות': '#FFA07A',
      'בנק בינלאומי': '#98D8C8'
    };

    // Default mock data
    const mockData = {
      'בנק פועלים': { marketCap: 107.904, bookValue: 64.677, weight: 0.3478 },
      'בנק לאומי': { marketCap: 114.127, bookValue: 68.130, weight: 0.3330 },
      'דיסקונט בנק': { marketCap: 40.277, bookValue: 33.809, weight: 0.1450 },
      'בנק מזרחי טפחות': { marketCap: 60.263, bookValue: 34.765, weight: 0.1275 },
      'בנק בינלאומי': { marketCap: 24.994, bookValue: 14.614, weight: 0.0467 }
    };

    async function fetchDataFromCSV() {
      try {
        const csvUrl = 'https://docs.google.com/spreadsheets/d/1rrODcerkbFY-VubbP8Hw0vlKdaZF1n0Zd8c1XMQQ4oE/export?format=csv';
        
        const response = await fetch(csvUrl);
        if (!response.ok) {
          console.log('CSV fetch failed, using mock data');
          return parseData(mockData);
        }
        
        const text = await response.text();
        const lines = text.trim().split('\n');
        
        if (lines.length < 2) {
          return parseData(mockData);
        }

        const data = {};
        for (let i = 1; i < lines.length; i++) {
          const values = lines[i].split(',').map(v => v.trim().replace(/"/g, ''));
          if (values.length >= 3) {
            const bankName = values[0];
            const marketCap = parseFloat(values[1]) || 0;
            const bookValue = parseFloat(values[2]) || 0;
            
            data[bankName] = {
              marketCap: marketCap,
              bookValue: bookValue,
              weight: BANK_WEIGHTS[bankName] || 0
            };
          }
        }

        return parseData(data);
      } catch (error) {
        console.error('Fetch error:', error);
        return parseData(mockData);
      }
    }

    function parseData(data) {
      const result = {};
      let totalWeightedPB = 0;
      let totalWeight = 0;

      for (const [name, info] of Object.entries(data)) {
        const pb = info.bookValue > 0 ? info.marketCap / info.bookValue : 0;
        result[name] = {
          marketCap: info.marketCap,
          bookValue: info.bookValue,
          priceToBook: parseFloat(pb.toFixed(3)),
          weight: info.weight || 0
        };
        
        totalWeightedPB += pb * (info.weight || 0);
        totalWeight += (info.weight || 0);
      }

      const weightedAvg = totalWeight > 0 ? totalWeightedPB / totalWeight : 0;
      
      return { banks: result, weightedAvg: parseFloat(weightedAvg.toFixed(3)) };
    }

    async function renderDashboard() {
      const { banks, weightedAvg } = await fetchDataFromCSV();

      let html = '<div class="disclaimer">⚠️ הערה חשובה: המידע בדאשבורד זה מיועד למטרות למידה בלבד ואינו מהווה שום המלצה להשקעה, ייעוץ פיננסי או הנחיות מסחר.</div>';

      // Metrics
      html += '<div class="metrics-grid">';
      html += `<div class="metric-card"><div class="metric-label">ממוצע משוקלל</div><div class="metric-value">${weightedAvg.toFixed(3)}</div></div>`;
      
      for (const [name, info] of Object.entries(banks)) {
        html += `<div class="metric-card">
          <div class="metric-label">${name}</div>
          <div class="metric-value">${info.priceToBook.toFixed(3)}</div>
        </div>`;
      }
      html += '</div>';

      // Table
      html += '<h2 class="section-title">פירוט מכפילים</h2>';
      html += '<div class="table-responsive"><table>';
      html += '<thead><tr><th>בנק</th><th>שווי שוק (מ"ש)</th><th>הון עצמי (מ"ש)</th><th>מכפיל הון (P/B)</th><th>משקל</th><th>ביחס לממוצע</th></tr></thead>';
      html += '<tbody>';

      for (const [name, info] of Object.entries(banks)) {
        const isAboveAvg = info.priceToBook > weightedAvg;
        const comparison = isAboveAvg ? 'מעל הממוצע' : 'מתחת לממוצע';
        const comparisonClass = isAboveAvg ? 'above-avg' : 'below-avg';
        const weight = info.weight ? `${(info.weight * 100).toFixed(2)}%` : '-';

        html += `<tr>
          <td class="bank-name">${name}</td>
          <td>${info.marketCap.toFixed(1)}</td>
          <td>${info.bookValue.toFixed(1)}</td>
          <td class="above-avg">${info.priceToBook.toFixed(3)}</td>
          <td>${weight}</td>
          <td><span class="${comparisonClass}">${comparison}</span></td>
        </tr>`;
      }

      html += '</tbody></table></div>';

      document.getElementById('content').innerHTML = html;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', renderDashboard);
  </script>
</body>
</html>
