<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מכפילי הבנקים בישראל</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    /* הגדרות קריטיות - ביטול כל נעילת גובה */
    html {
      margin: 0;
      padding: 0;
      height: auto !important; /* מאפשר לדף להיות ארוך מהמסך */
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto !important; /* ביטול נעילה ל-100% */
      min-height: 100vh;
      background-color: #faf7f2;
      overflow-y: auto !important; /* מחזיר את הגלילה הטבעית של הדפדפן */
      font-family: sans-serif;
      display: block; /* מבטיח זרימה אנכית טבעית */
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: white;
      display: block; /* זרימת אלמנטים אחד מתחת לשני */
      padding-bottom: 50px; /* רווח בסוף הדף */
    }

    .header {
      background: #8B7355;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .content-section {
      padding: 20px;
    }

    .chart-wrapper {
      width: 100%;
      height: 400px; /* גובה קבוע לגרף כדי שלא יקרוס */
      margin-bottom: 50px;
    }

    .stats-card {
      background: #f5f1e8;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 30px;
      border-top: 5px solid #8B7355;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      text-align: right;
    }

    th { background: #f9f9f9; }
  </style>
</head>
<body>

<div class="main-container">
  <div class="header">
    <h1>מכפילי הבנקים בישראל</h1>
    <p>ניתוח נתונים בזמן אמת</p>
  </div>

  <div class="content-section">
    <div id="summary" class="stats-card">טוען נתונים...</div>
    
    <div class="chart-wrapper">
      <canvas id="bankChart"></canvas>
    </div>

    <div id="table-output"></div>
  </div>
</div>

<script>
  async function loadDashboard() {
    // נתוני דוגמה מהירים להצגה מיידית
    const data = [
      { name: 'בנק פועלים', pb: 1.668, cap: 107904, book: 64677 },
      { name: 'בנק לאומי', pb: 1.675, cap: 114127, book: 68130 },
      { name: 'דיסקונט', pb: 1.250, cap: 40277, book: 33809 },
      { name: 'מזרחי טפחות', pb: 1.820, cap: 60263, book: 34765 },
      { name: 'בינלאומי', pb: 1.790, cap: 24994, book: 14614 }
    ];

    const avg = data.reduce((s, b) => s + b.pb, 0) / data.length;
    
    document.getElementById('summary').innerHTML = `
      <div style="font-size: 14px;">ממוצע מכפיל הון (P/B)</div>
      <div style="font-size: 32px; font-weight: bold; color: #8B7355;">${avg.toFixed(3)}</div>
    `;

    let html = '<table><thead><tr><th>בנק</th><th>שווי שוק</th><th>P/B</th></tr></thead><tbody>';
    data.forEach(b => {
      html += `<tr><td><strong>${b.name}</strong></td><td>${b.cap.toLocaleString()}</td><td style="color:${b.pb > avg ? 'red' : 'green'}">${b.pb.toFixed(3)}</td></tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('table-output').innerHTML = html;

    new Chart(document.getElementById('bankChart'), {
      type: 'bar',
      data: {
        labels: data.map(b => b.name),
        datasets: [{
          label: 'מכפיל הון',
          data: data.map(b => b.pb),
          backgroundColor: '#8B7355',
          borderRadius: 5
        }]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false 
      }
    });
  }

  window.onload = loadDashboard;
</script>
</body>
</html>
