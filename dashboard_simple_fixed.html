<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מכפילי הבנקים בישראל | משקיענית</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc4 100%);
      padding: 0;
      margin: 0;
      color: #3e2723;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    /* Hide Netlify bar */
    [data-netlify-identity-menu],
    [data-netlify-identity-button],
    .netlify-cms-log-in,
    #netlify-identity-menu {
      display: none !important;
    }

    /* Hide scrollbars and GitHub bars */
    ::-webkit-scrollbar {
      display: none;
    }
    
    html {
      scrollbar-width: none;
    }
    
    /* Hide GitHub Pages sidebar */
    .github-corner,
    [role="contentinfo"],
    .page-header,
    .site-footer {
      display: none !important;
    }

    .dashboard-container {
      max-width: 100%;
      width: 100%;
      margin: 0;
      background: #faf7f2;
      overflow: hidden;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #8B7355 0%, #6F4E37 100%);
      color: #f5f1e8;
      padding: 30px 40px;
      border-bottom: 4px solid #5C4033;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      width: 100%;
    }

    .header-content {
      flex: 1;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .header-subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .logo-container {
      width: 120px;
      height: 120px;
      background: rgba(255, 253, 208, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .content {
      padding: 40px;
      width: 100%;
    }

    .disclaimer {
      background: #fff3cd;
      border-left: 4px solid #8B7355;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 30px;
      font-size: 12px;
      color: #5C4033;
    }

    .info-box {
      background: #f0f8ff;
      border-left: 4px solid #4ECDC4;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 30px;
      font-size: 12px;
      color: #2C5F8D;
      line-height: 1.6;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc4 100%);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      border-left: 4px solid #8B7355;
      box-shadow: 0 2px 8px rgba(92, 64, 51, 0.08);
    }

    .metric-label {
      font-size: 12px;
      color: #6F4E37;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: #8B7355;
    }

    .chart-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #3e2723;
      display: flex;
      align-items: center;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 24px;
      background: #8B7355;
      margin-left: 8px;
      border-radius: 2px;
    }

    .chart-container {
      position: relative;
      height: 400px;
      margin-bottom: 20px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table thead {
      background: #e8dcc4;
      border-bottom: 2px solid #8B7355;
    }

    table th {
      padding: 15px;
      text-align: right;
      font-weight: 600;
      color: #5C4033;
    }

    table td {
      padding: 15px;
      border-bottom: 1px solid #e8dcc4;
      color: #3e2723;
    }

    table tbody tr:hover {
      background: #faf7f2;
    }

    .bank-name {
      font-weight: 600;
      color: #8B7355;
    }

    .above-avg {
      color: #558B2F;
      font-weight: 600;
    }

    .below-avg {
      color: #C62828;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6F4E37;
    }

    .spinner {
      border: 3px solid #f5f1e8;
      border-top: 3px solid #8B7355;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      background: #e8dcc4;
      padding: 20px 30px;
      text-align: center;
      border-top: 1px solid #A0826D;
      font-size: 12px;
      color: #5C4033;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="header">
      <div class="header-content">
        <h1>מכפילי הבנקים בישראל</h1>
        <p class="header-subtitle">צפה בנתוני שווי הוני של הבנקים בישראל</p>
        <p class="header-subtitle">משקיענית | מכפילי ההון של הבנקים מול הממוצע המשוקלל של מדד הבנקים</p>
      </div>
      <div class="logo-container">
        <img src="https://static.wixstatic.com/media/894475_0fbb7c240f6e4744a0d012d6566a4ce6~mv2.png/v1/fill/w_426,h_426,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/%D7%9C%D7%95%D7%92%D7%95%20%D7%9E%D7%A9%D7%A7%D7%99%D7%A2%D7%A0%D7%99%D7%AA%20(1)_edited.png" alt="Mashkianit">
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>טוען נתונים...</p>
      </div>
    </div>

    <div class="footer">
      ⚠️ הערה חשובה: המידע בדאשבורד זה מיועד למטרות למידה בלבד ואינו מהווה שום המלצה להשקעה.
    </div>
  </div>

  <script>
    // Bank weights
    const BANK_WEIGHTS = {
      'בנק פועלים': 0.3478,
      'בנק לאומי': 0.3330,
      'דיסקונט בנק': 0.1450,
      'בנק מזרחי טפחות': 0.1275,
      'בנק בינלאומי': 0.0467
    };

    // Bank colors
    const bankColors = {
      'בנק פועלים': '#FF6B6B',
      'בנק לאומי': '#4ECDC4',
      'דיסקונט בנק': '#45B7D1',
      'בנק מזרחי טפחות': '#FFA07A',
      'בנק בינלאומי': '#98D8C8'
    };

    // Historical data
    const historicalData = {
      years: ['2021', '2022', '2023', '2024', '2025'],
      banks: {
        'בנק פועלים': [1.0, 0.9, 0.9, 1.0, 1.6],
        'בנק לאומי': [1.1, 0.9, 0.8, 1.2, 1.6],
        'דיסקונט בנק': [1.1, 0.9, 0.8, 1.0, 1.2],
        'בנק מזרחי טפחות': [1.4, 1.2, 1.1, 1.5, 1.8],
        'בנק בינלאומי': [1.3, 1.4, 1.3, 1.4, 1.8]
      }
    };

    // Mock data
    const mockData = {
      'בנק פועלים': { marketCap: 107.904, bookValue: 64.677, weight: 0.3478 },
      'בנק לאומי': { marketCap: 114.127, bookValue: 68.130, weight: 0.3330 },
      'דיסקונט בנק': { marketCap: 40.277, bookValue: 33.809, weight: 0.1450 },
      'בנק מזרחי טפחות': { marketCap: 60.263, bookValue: 34.765, weight: 0.1275 },
      'בנק בינלאומי': { marketCap: 24.994, bookValue: 14.614, weight: 0.0467 }
    };

    let timelineChart = null;

    function createTimelineChart() {
      const ctx = document.getElementById('timelineChart');
      if (!ctx) return;

      const datasets = [];
      
      for (const bankName of Object.keys(historicalData.banks)) {
        datasets.push({
          label: bankName,
          data: historicalData.banks[bankName],
          borderColor: bankColors[bankName],
          backgroundColor: bankColors[bankName] + '20',
          borderWidth: 2.5,
          pointRadius: 5,
          pointBackgroundColor: bankColors[bankName],
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          tension: 0.3,
          fill: true
        });
      }

      if (timelineChart) {
        timelineChart.destroy();
      }

      timelineChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: historicalData.years,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                usePointStyle: true,
                padding: 15,
                font: {
                  size: 12,
                  weight: 'bold'
                },
                color: '#3e2723'
              }
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: 0.5,
              max: 2.0,
              ticks: {
                color: '#6F4E37',
                font: { size: 11 }
              },
              grid: {
                color: 'rgba(160, 130, 109, 0.1)',
                drawBorder: false
              }
            },
            x: {
              ticks: {
                color: '#6F4E37',
                font: { size: 11 }
              },
              grid: {
                display: false,
                drawBorder: false
              }
            }
          }
        }
      });
    }

    async function fetchDataFromCSV() {
      try {
        const csvUrl = 'https://docs.google.com/spreadsheets/d/1rrODcerkbFY-VubbP8Hw0vlKdaZF1n0Zd8c1XMQQ4oE/export?format=csv';
        
        const response = await fetch(csvUrl);
        if (!response.ok) {
          console.log('CSV fetch failed, using mock data');
          return parseData(mockData);
        }
        
        const text = await response.text();
        const lines = text.trim().split('\n');
        
        if (lines.length < 2) {
          return parseData(mockData);
        }

        const data = {};
        for (let i = 1; i < lines.length; i++) {
          const values = lines[i].split(',').map(v => v.trim().replace(/"/g, ''));
          if (values.length >= 3) {
            const bankName = values[0];
            const marketCap = parseFloat(values[1]) || 0;
            const bookValue = parseFloat(values[2]) || 0;
            
            data[bankName] = {
              marketCap: marketCap,
              bookValue: bookValue,
              weight: BANK_WEIGHTS[bankName] || 0
            };
          }
        }

        return parseData(data);
      } catch (error) {
        console.error('Fetch error:', error);
        return parseData(mockData);
      }
    }

    function parseData(data) {
      const result = {};
      let totalWeightedPB = 0;
      let totalWeight = 0;

      for (const name of Object.keys(data)) {
        const info = data[name];
        const pb = info.bookValue > 0 ? info.marketCap / info.bookValue : 0;
        result[name] = {
          marketCap: info.marketCap,
          bookValue: info.bookValue,
          priceToBook: parseFloat(pb.toFixed(3)),
          weight: info.weight || 0
        };
        
        totalWeightedPB += pb * (info.weight || 0);
        totalWeight += (info.weight || 0);
      }

      const weightedAvg = totalWeight > 0 ? totalWeightedPB / totalWeight : 0;
      
      return { banks: result, weightedAvg: parseFloat(weightedAvg.toFixed(3)) };
    }

    async function renderDashboard() {
      const dashData = await fetchDataFromCSV();
      const banks = dashData.banks;
      const weightedAvg = dashData.weightedAvg;

      let html = '<div class="disclaimer">⚠️ הערה חשובה: המידע בדאשבורד זה מיועד למטרות למידה בלבד ואינו מהווה שום המלצה להשקעה, ייעוץ פיננסי או הנחיות מסחר.</div>';

      // Calculate statistics
      let aboveAvgCount = 0;
      let belowAvgCount = 0;
      
      for (const name of Object.keys(banks)) {
        const info = banks[name];
        if (info.priceToBook > weightedAvg) {
          aboveAvgCount++;
        } else {
          belowAvgCount++;
        }
      }

      // Statistics section
      html += '<div class="metrics-grid">';
      html += '<div class="metric-card"><div class="metric-label">ממוצע משוקלל</div><div class="metric-value">' + weightedAvg.toFixed(3) + '</div></div>';
      html += '<div class="metric-card"><div class="metric-label">בנקים מעל הממוצע</div><div class="metric-value">' + aboveAvgCount + '</div></div>';
      html += '<div class="metric-card"><div class="metric-label">בנקים מתחת לממוצע</div><div class="metric-value">' + belowAvgCount + '</div></div>';
      html += '</div>';

      // Info about weighted average
      html += '<div class="info-box">הממוצע המשוקלל מחושב על סמך משקלי הבנקים במדד הבנקים (ת"א בנקים-5): בנק פועלים 34.78%, בנק לאומי 33.30%, דיסקונט בנק 14.50%, בנק מזרחי טפחות 12.75%, בנק בינלאומי 4.67%</div>';

      // Historical chart
      html += '<h2 class="section-title">מכפילי הון - נתונים היסטוריים (2021-2025)</h2>';
      html += '<div class="chart-section"><div class="chart-container"><canvas id="timelineChart"></canvas></div></div>';

      // Table
      html += '<h2 class="section-title">פירוט מכפילים</h2>';
      html += '<div class="table-responsive"><table>';
      html += '<thead><tr><th>בנק</th><th>שווי שוק (מ"ש)</th><th>הון עצמי (מ"ש)</th><th>מכפיל הון (P/B)</th><th>משקל</th><th>ביחס לממוצע</th></tr></thead>';
      html += '<tbody>';

      for (const name of Object.keys(banks)) {
        const info = banks[name];
        const isAboveAvg = info.priceToBook > weightedAvg;
        const comparison = isAboveAvg ? 'מעל הממוצע' : 'מתחת לממוצע';
        const comparisonClass = isAboveAvg ? 'above-avg' : 'below-avg';
        const weight = info.weight ? (info.weight * 100).toFixed(2) + '%' : '-';

        html += '<tr><td class="bank-name">' + name + '</td><td>' + info.marketCap.toFixed(1) + '</td><td>' + info.bookValue.toFixed(1) + '</td><td class="above-avg">' + info.priceToBook.toFixed(3) + '</td><td>' + weight + '</td><td><span class="' + comparisonClass + '">' + comparison + '</span></td></tr>';
      }

      html += '</tbody></table></div>';

      document.getElementById('content').innerHTML = html;
      
      setTimeout(function() {
        createTimelineChart();
      }, 100);
    }

    document.addEventListener('DOMContentLoaded', renderDashboard);
  </script>
</body>
</html>
