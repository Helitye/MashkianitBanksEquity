<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מכפילי הבנקים בישראל | משקיענית</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    /* הגדרות גלובליות - מאפשרות לדף לצמוח באופן טבעי */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh; /* מבטיח שהרקע ימלא את המסך */
      background: #faf7f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-y: auto; /* מאפשר גלילה טבעית בדפדפן */
      overflow-x: hidden;
    }

    /* הסתרת פס הגלילה המעוצב לטובת מראה נקי */
    body::-webkit-scrollbar { width: 6px; }
    body::-webkit-scrollbar-thumb { background: #8B7355; border-radius: 10px; }

    .dashboard-container {
      width: 100%;
      max-width: 1000px; /* רוחב נוח לקריאה בדסקטופ */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      background: #ffffff;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #8B7355 0%, #6F4E37 100%);
      color: #f5f1e8;
      padding: 30px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #5C4033;
    }

    .header h1 { margin: 0; font-size: clamp(20px, 5vw, 32px); }

    .logo-container {
      width: 80px;
      height: 80px;
      background: rgba(255, 253, 208, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img { width: 80%; height: 80%; object-fit: contain; filter: brightness(0) invert(1); }

    .content { padding: 30px 20px; flex-grow: 1; }

    .metric-card {
      background: #f5f1e8;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      border-top: 5px solid #8B7355;
      margin-bottom: 30px;
    }

    .chart-container {
      position: relative;
      height: 400px; /* גובה קבוע לגרף */
      width: 100%;
      margin-bottom: 40px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e8dcc4;
    }

    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    table th { background: #e8dcc4; padding: 15px; text-align: right; }
    table td { padding: 15px; border-bottom: 1px solid #e8dcc4; }

    .footer {
      background: #e8dcc4;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #5C4033;
    }
  </style>
</head>
<body>

<div class="dashboard-container">
  <div class="header">
    <div>
      <h1>מכפילי הבנקים בישראל</h1>
      <p style="margin: 5px 0 0; opacity: 0.8;">משקיענית | ניתוח מכפילי הון בזמן אמת</p>
    </div>
    <div class="logo-container">
      <img src="https://static.wixstatic.com/media/894475_0fbb7c240f6e4744a0d012d6566a4ce6~mv2.png" alt="Logo">
    </div>
  </div>

  <div class="content" id="content">
    <div style="text-align: center; padding: 100px;">טוען נתונים...</div>
  </div>

  <div class="footer">
    ⚠️ המידע מוצג למטרות למידה בלבד ואינו מהווה ייעוץ השקעות או המלצה לפעולה.
  </div>
</div>

<script>
  const BANK_WEIGHTS = { 'בנק פועלים': 0.3478, 'בנק לאומי': 0.3330, 'דיסקונט בנק': 0.1450, 'בנק מזרחי טפחות': 0.1275, 'בנק בינלאומי': 0.0467 };
  const bankColors = { 'בנק פועלים': '#FF6B6B', 'בנק לאומי': '#4ECDC4', 'דיסקונט בנק': '#45B7D1', 'בנק מזרחי טפחות': '#FFA07A', 'בנק בינלאומי': '#98D8C8' };

  async function init() {
    try {
      const resp = await fetch('https://docs.google.com/spreadsheets/d/1rrODcerkbFY-VubbP8Hw0vlKdaZF1n0Zd8c1XMQQ4oE/export?format=csv');
      const text = await resp.text();
      const lines = text.trim().split('\n').slice(1);
      const data = lines.map(l => {
        const [name, cap, book] = l.split(',').map(v => v.trim().replace(/"/g,''));
        return { name, cap: parseFloat(cap), book: parseFloat(book), pb: parseFloat(cap)/parseFloat(book) };
      }).filter(item => !isNaN(item.pb));
      
      render(data);
    } catch(e) {
      // נתוני דוגמה למקרה של שגיאה בטעינה
      render([
        {name: 'בנק פועלים', cap: 107904, book: 64677, pb: 1.668},
        {name: 'בנק לאומי', cap: 114127, book: 68130, pb: 1.675}
      ]);
    }
  }

  function render(data) {
    const avg = data.reduce((sum, b) => sum + b.pb, 0) / data.length;
    
    document.getElementById('content').innerHTML = `
      <div class="metric-card">
        <div style="font-size: 14px; color: #6F4E37;">ממוצע מכפילי הון (P/B)</div>
        <div style="font-size: 36px; font-weight: 800; color: #8B7355;">${avg.toFixed(3)}</div>
      </div>
      
      <div class="chart-container">
        <canvas id="mainChart"></canvas>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>שם הבנק</th>
              <th>שווי שוק (מ"ש)</th>
              <th>הון עצמי (מ"ש)</th>
              <th>מכפיל הון</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(b => `
              <tr>
                <td><strong>${b.name}</strong></td>
                <td>${b.cap.toLocaleString()}</td>
                <td>${b.book.toLocaleString()}</td>
                <td style="font-weight: bold; color: ${b.pb > avg ? '#C62828' : '#2E7D32'}">${b.pb.toFixed(3)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    new Chart(document.getElementById('mainChart'), {
      type: 'bar',
      data: {
        labels: data.map(b => b.name),
        datasets: [{
          label: 'מכפיל הון נוכחי',
          data: data.map(b => b.pb),
          backgroundColor: data.map(b => bankColors[b.name] || '#8B7355'),
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  window.onload = init;
</script>
</body>
</html>
